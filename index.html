<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKY Game - Hard Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body { background: #05050a; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #game-box { position: relative; width: 350px; height: 500px; border: 2px solid #00f3ff; background: #0d0f18; overflow: hidden; }
        #ui { position: absolute; top: 10px; left: 10px; color: #00f3ff; font-size: 18px; z-index: 10; font-weight: bold; }
        .watermark { position: absolute; top: 35%; width: 100%; text-align: center; color: rgba(0, 243, 255, 0.2); font-size: 22px; font-weight: bold; pointer-events: none; z-index: 1; }
        #player { position: absolute; width: 20px; height: 20px; background: #00f3ff; z-index: 5; transition: top 0.1s, left 0.1s; }
        #door { position: absolute; width: 25px; height: 35px; background: #ffe600; z-index: 3; }
        #obstacle { position: absolute; width: 20px; height: 30px; background: #ff0055; z-index: 4; }
        #controls { display: flex; gap: 30px; margin-top: 20px; }
        .btn { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #00f3ff; background: #1a1d2e; color: #00f3ff; font-size: 20px; outline: none; }
        .btn:active { background: #00f3ff; color: #000; }
    </style>
</head>
<body>
    <div id="game-box">
        <div id="ui">LEVEL: <span id="lvl">1</span>/100</div>
        <div class="watermark">ရဲမာန်အောင်<br>စောက်ချောကြီး</div>
        <div id="player" style="left: 20px; top: 400px;"></div>
        <div id="obstacle" style="left: 150px; top: 390px;"></div>
        <div id="door" style="left: 280px; top: 385px;"></div>
    </div>
    <div id="controls">
        <button class="btn" onclick="move(-20)">◀</button>
        <button class="btn" onclick="jump()">▲</button>
        <button class="btn" onclick="move(20)">▶</button>
    </div>

    <script>
        let p = document.getElementById('player');
        let d = document.getElementById('door');
        let obs = document.getElementById('obstacle');
        let lvlText = document.getElementById('lvl');
        
        let level = 1;
        let px = 20, py = 400;
        let isJumping = false;

        function updateGame() {
            lvlText.innerText = level;
            px = 20;
            py = 400;
            p.style.left = px + 'px';
            p.style.top = py + 'px';

            // Level တက်လေ အတားအဆီးနဲ့ တံခါးနေရာတွေ ပိုခက်အောင် ပြောင်းသွားမည်
            let obsX = 100 + ((level * 7) % 150);
            obs.style.left = obsX + 'px';

            let doorX = Math.min(300, 200 + (level * 2));
            d.style.left = doorX + 'px';
        }

        function move(dir) {
            px += dir;
            if (px < 0) px = 0;
            if (px > 320) px = 320;
            p.style.left = px + 'px';
            checkCollisions();
        }

        function jump() {
            if (isJumping) return;
            isJumping = true;
            py = 330; // အပေါ်ခုန်တက်မည်
            p.style.top = py + 'px';
            
            setTimeout(() => {
                py = 400; // ပြန်ကျမည်
                p.style.top = py + 'px';
                isJumping = false;
                checkCollisions();
            }, 300);
        }

        function checkCollisions() {
            let obsX = parseInt(obs.style.left);
            let doorX = parseInt(d.style.left);

            // အနီရောင် အတားအဆီးနဲ့ တိုက်မိရင် Level 1 ကို ပြန်ကျမည်
            if (Math.abs(px - obsX) < 15 && py > 350) {
                alert("Game Over! Level 1 ကို ပြန်စပါမည်။");
                level = 1;
                updateGame();
                return;
            }

            // တံခါးကို ရောက်ရင် Level တက်မည်
            if (Math.abs(px - doorX) < 20) {
                if (level < 100) {
                    level++;
                    alert("Level " + level + " သို့ ရောက်ရှိပါပြီ!");
                    updateGame();
                } else {
                    alert("ဂုဏ်ယူပါတယ်! Level 100 အထိ အကုန်နိုင်သွားပါပြီ!");
                }
            }
        }

        updateGame();
    </script>
</body>
</html>
