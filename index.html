<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKY - Level Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body { background: #05050a; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #game-box { position: relative; width: 100vw; max-width: 400px; height: 60vh; background: #0d0f18; border: 2px solid #00f3ff; overflow: hidden; }
        .bg-watermark { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: bold; color: rgba(0, 243, 255, 0.2); text-align: center; pointer-events: none; z-index: 1; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 10; display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); padding: 5px; border: 1px solid #00f3ff; color: #00f3ff; }
        .platform { position: absolute; background: #1a1d2e; border: 1px solid #3d4468; z-index: 2; }
        #player { position: absolute; width: 16px; height: 24px; background: #00f3ff; z-index: 5; }
        #door { position: absolute; width: 20px; height: 35px; background: #ffe600; z-index: 3; }
        #controls { display: flex; gap: 20px; margin-top: 20px; }
        .btn { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #00f3ff; background: transparent; color: #00f3ff; font-size: 20px; }
    </style>
</head>
<body>
    <div id="game-box">
        <div id="ui"><span>LEVEL: <span id="lvl-display">1</span>/100</span></div>
        <div class="bg-watermark">ရဲမာန်အောင်<br>စောက်ချောကြီး</div>
        <div id="player"></div>
        <div id="door"></div>
        <div id="platforms"></div>
    </div>
    <div id="controls">
        <button class="btn" onclick="move(-20)">◀</button>
        <button class="btn" onclick="jump()">▲</button>
        <button class="btn" onclick="move(20)">▶</button>
    </div>

    <script>
        const player = document.getElementById('player');
        const door = document.getElementById('door');
        const plats = document.getElementById('platforms');
        let level = 1;
        let px = 50, py = 300, vy = 0;

        function initLevel() {
            document.getElementById('lvl-display').innerText = level;
            plats.innerHTML = '';
            // ပလက်ဖောင်း အနည်းငယ် ထည့်ပေးထားပါတယ်
            for(let i=0; i<3; i++) {
                let p = document.createElement('div');
                p.className = 'platform';
                p.style.left = (i * 120) + 'px'; p.style.top = (350 - (i*50)) + 'px';
                p.style.width = '100px'; p.style.height = '15px';
                plats.appendChild(p);
            }
            door.style.left = '350px'; door.style.top = '200px';
        }

        function move(dir) { px += dir; player.style.left = px + 'px'; checkWin(); }
        function jump() { if(py >= 300) vy = -15; }
        
        function update() {
            vy += 0.8; py += vy;
            if (py >= 300) { py = 300; vy = 0; }
            player.style.left = px + 'px';
            player.style.top = py + 'px';
            requestAnimationFrame(update);
        }

        function checkWin() {
            let dx = parseInt(door.style.left);
            if (px > dx - 30 && px < dx + 30) {
                level++;
                px = 50;
                initLevel();
            }
        }

        initLevel();
        update();
    </script>
</body>
</html>
