<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Again - Dark Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { background-color: #050508; color: #00ffcc; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 100vw; max-width: 800px; height: 60vh; max-height: 450px; background: #0d0e15; border: 2px solid #00ffcc; overflow: hidden; }
        
        /* နောက်ခံ စာသားပုံစံ */
        .bg-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: bold;
            color: rgba(0, 255, 204, 0.25);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
        }

        #player { position: absolute; bottom: 20px; left: 50px; width: 40px; height: 40px; background: #00ffcc; box-shadow: 0 0 10px #00ffcc; transition: bottom 0.1s; z-index: 2; }
        .obstacle { position: absolute; bottom: 0; width: 30px; height: 50px; background: #ff3366; box-shadow: 0 0 10px #ff3366; z-index: 2; }
        #score { font-size: 24px; margin-bottom: 20px; text-shadow: 0 0 5px #00ffcc; }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <div id="game-container" onclick="jump()">
        <div class="bg-text">ရဲမာန်အောင်<br>စောက်ချောကြီး</div>
        <div id="player"></div>
    </div>
    <script>
        let player = document.getElementById("player");
        let scoreElement = document.getElementById("score");
        let score = 0;
        let isJumping = false;
        function jump() {
            if (isJumping) return;
            isJumping = true;
            player.style.bottom = "150px";
            setTimeout(() => { player.style.bottom = "20px"; isJumping = false; }, 500);
        }
        function createObstacle() {
            let obs = document.createElement("div");
            obs.className = "obstacle";
            obs.style.right = "-50px";
            document.getElementById("game-container").appendChild(obs);
            let pos = -50;
            let timer = setInterval(() => {
                pos += 5;
                obs.style.right = pos + "px";
                if (pos > 800) { obs.remove(); clearInterval(timer); score++; scoreElement.innerText = "Score: " + score; }
                if (pos > 710 && pos < 760 && !isJumping) { alert("Game Over! Score: " + score); location.reload(); }
            }, 20);
        }
        setInterval(createObstacle, 2000);
    </script>
</body>
</html>
