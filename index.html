<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Die Again - Dark Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #050508;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 800px;
            height: 60vh;
            max-height: 450px;
            background: #0d0e15;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            background: rgba(5, 5, 8, 0.8);
            border: 1px solid #00ffcc;
            padding: 6px 12px;
            border-radius: 4px;
            pointer-events: none;
            text-shadow: 0 0 5px #00ffcc;
        }
        #controls {
            width: 100vw;
            max-width: 800px;
            height: 25vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #050508;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            width: 60px;
            height: 60px;
            background: #12131c;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        .btn:active {
            background: #00ffcc;
            color: #050508;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        LEVEL: <span id="level-num">1</span>/100 | DEATHS: <span id="death-count">0</span>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<div id="controls">
    <div class="btn-group">
        <div class="btn" id="btn-left">◄</div>
        <div class="btn" id="btn-right">►</div>
    </div>
    <div class="btn-group">
        <div class="btn" id="btn-jump">▲</div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = 800;
canvas.height = 450;

let currentLevel = 1;
let deaths = 0;
let deadBodies = [];

const gravity = 0.5;

const player = {
    x: 40,
    y: 300,
    width: 20,
    height: 30,
    vx: 0,
    vy: 0,
    speed: 4.5,
    jumpPower: -10.5,
    grounded: false
};

let platforms = [];
let spikes = [];
let goal = { x: 730, y: 100, width: 40, height: 60 };

// 100 Levels Generator
function loadLevel(lvl) {
    deadBodies = [];
    player.x = 40;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;

    document.getElementById("level-num").innerText = lvl;

    platforms = [
        { x: 0, y: 400, width: 800, height: 50 }, // Base Ground
        { x: 0, y: 0, width: 20, height: 450 },
        { x: 780, y: 0, width: 20, height: 450 }
    ];
    spikes = [];

    // Level သလိုက် ခက်ခဲအောင် ဖန်တီးခြင်း
    let stepCount = Math.min(3 + Math.floor(lvl / 10), 7);
    let startX = 120;
    
    for (let i = 0; i < stepCount; i++) {
        let pWidth = Math.max(120 - lvl, 50);
        let pX = startX + (i * (600 / stepCount));
        let pY = 320 - (i * 45);
        
        platforms.push({ x: pX, y: pY, width: pWidth, height: 18 });

        // Add Spikes based on Level difficulty
        if (i > 0 && Math.random() < 0.4 + (lvl * 0.005)) {
            spikes.push({
                x: pX + (pWidth / 4),
                y: pY - 15,
                width: Math.min(25, pWidth / 2),
                height: 15
            });
        }
    }

    // Ground Spikes
    let groundSpikeCount = Math.min(Math.floor(lvl / 5) + 1, 6);
    for (let j = 0; j < groundSpikeCount; j++) {
        spikes.push({
            x: 180 + (j * 90),
            y: 385,
            width: 30,
            height: 15
        });
    }

    goal.x = 710;
    goal.y = Math.max(60, 320 - (stepCount * 45));
}

const keys = { left: false, right: false, up: false };

window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
    if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.up = true;
});

window.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
    if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") keys.up = false;
});

function setupTouch(id, keyName) {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[keyName] = true; });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[keyName] = false; });
    btn.addEventListener("mousedown", () => { keys[keyName] = true; });
    btn.addEventListener("mouseup", () => { keys[keyName] = false; });
}
setupTouch("btn-left", "left");
setupTouch("btn-right", "right");
setupTouch("btn-jump", "up");

function killPlayer() {
    // သေသွားပါက ခန္ဓာကိုယ်ကျန်ခဲ့မည်
    deadBodies.push({ x: player.x, y: player.y, width: player.width, height: player.height });
    deaths++;
    document.getElementById("death-count").innerText = deaths;
    
    player.x = 40;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
}

function update() {
    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx = 0;

    if (keys.up && player.grounded) {
        player.vy = player.jumpPower;
        player.grounded = false;
    }

    player.vy += gravity;
    player.x += player.vx;
    player.y += player.vy;

    player.grounded = false;

    const allPlatforms = [...platforms, ...deadBodies];
    
    allPlatforms.forEach(p => {
        if (player.x < p.x + p.width &&
            player.x + player.width > p.x &&
            player.y < p.y + p.height &&
            player.y + player.height > p.y) {
            
            if (player.vy > 0 && player.y + player.height - player.vy <= p.y + 12) {
                player.y = p.y - player.height;
                player.vy = 0;
                player.grounded = true;
            }
        }
    });

    spikes.forEach(s => {
        if (player.x < s.x + s.width &&
            player.x + player.width > s.x &&
            player.y < s.y + s.height &&
            player.y + player.height > s.y) {
            killPlayer();
        }
    });

    // Level နိုင်ပါက နောက် Level သို့ကူးမည်
    if (player.x < goal.x + goal.width &&
        player.x + player.width > goal.x &&
        player.y < goal.y + goal.height &&
        player.y + player.height > goal.y) {
        
        if (currentLevel < 100) {
            currentLevel++;
            loadLevel(currentLevel);
        } else {
            alert("ဂုဏ်ယူပါတယ်! Level 100 စလုံးကို အောင်မြင်စွာ ဆော့ကစားပြီးပါပြီ။");
            currentLevel = 1;
            deaths = 0;
            loadLevel(currentLevel);
        }
    }

    if (player.y > canvas.height) {
        killPlayer();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dark Grid Background
    ctx.strokeStyle = "#151825";
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Platforms (Dark Blue Glow)
    ctx.fillStyle = "#1a1d2e";
    ctx.strokeStyle = "#3d446b";
    ctx.lineWidth = 2;
    platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
        ctx.strokeRect(p.x, p.y, p.width, p.height);
    });

    // Spikes (Neon Red)
    ctx.fillStyle = "#ff0055";
    ctx.shadowColor = "#ff0055";
    ctx.shadowBlur = 8;
    spikes.forEach(s => {
        ctx.beginPath();
        ctx.moveTo(s.x, s.y + s.height);
        ctx.lineTo(s.x + s.width / 2, s.y);
        ctx.lineTo(s.x + s.width, s.y + s.height);
        ctx.fill();
    });
    ctx.shadowBlur = 0;

    // Dead Bodies (Ghostly Purple)
    ctx.fillStyle = "#6c5ce7";
    deadBodies.forEach(b => {
        ctx.fillRect(b.x, b.y, b.width, b.height);
    });

    // Goal Door (Neon Gold/Yellow)
    ctx.fillStyle = "#ffeaa7";
    ctx.shadowColor = "#fdcb6e";
    ctx.shadowBlur = 12;
    ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
    ctx.shadowBlur = 0;

    // Player (Neon Cyan Character with Eyes)
    ctx.fillStyle = "#00ffcc";
    ctx.shadowColor = "#00ffcc";
    ctx.shadowBlur = 10;
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.shadowBlur = 0;

    // Player Eyes (ဆန်းဆန်းလေးဖြစ်အောင် မျက်လုံး ထည့်ပေးထားသည်)
    ctx.fillStyle = "#050508";
    ctx.fillRect(player.x + 12, player.y + 6, 4, 6);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loadLevel(1);
loop();
</script>
</body>
</html>
